  - name: model_revenue_ytd
    description: "Year-to-date revenue aggregated at model variant + source region level. One row per model_variant + source_region for the current calendar year. Static table — rebuilt on each run. Includes revenue rankings within model family, within region, and overall, plus cumulative revenue share for Pareto analysis."
    group: finance
    columns:
      - name: model_variant
        data_type: character varying
        description: "Model variant identifier e.g. claude-3-5-sonnet-20241022."

      - name: model_family
        data_type: character varying
        description: "Model family grouping e.g. Claude 3, Claude 3.5. Joined from dim_model."

      - name: model_publisher
        data_type: character varying
        description: "Organisation that published the model — Anthropic, Meta, Mistral etc. Joined from dim_model."

      - name: source_region
        data_type: character varying
        description: "AWS region where the request originated e.g. us-east-1."

      - name: territory
        data_type: character varying
        description: "AWS territory grouping — Americas, EMEA, APAC. Joined from dim_region."

      - name: govcloud
        data_type: boolean
        description: "{{ doc('govcloud_definition') }}"

      - name: ytd_start_date
        data_type: date
        description: "Earliest revenue date in the current calendar year for this model + region."

      - name: ytd_end_date
        data_type: date
        description: "Latest revenue date in the current calendar year for this model + region."

      - name: year
        data_type: numeric
        description: "Calendar year — extracted from ytd_end_date."

      - name: ytd_gross_revenue
        data_type: numeric
        description: "Total gross revenue year-to-date before discounts and credits."

      - name: ytd_net_revenue
        data_type: numeric
        description: "Total net revenue year-to-date. {{ doc('net_revenue_definition') }}"

      - name: unique_customers_ytd
        data_type: bigint
        description: "Number of distinct customer accounts that generated revenue year-to-date."

      - name: active_days
        data_type: bigint
        description: "Number of distinct days with revenue activity year-to-date."

      - name: avg_daily_net_revenue
        data_type: numeric
        description: "Average net revenue per active day year-to-date."

      - name: max_daily_net_revenue
        data_type: numeric
        description: "Highest single-day net revenue year-to-date."

      - name: min_daily_net_revenue
        data_type: numeric
        description: "Lowest single-day net revenue year-to-date."

      - name: active_months
        data_type: bigint
        description: "Number of distinct calendar months with revenue activity year-to-date."

      - name: avg_monthly_net_revenue
        data_type: numeric
        description: "Average net revenue per active month year-to-date."

      - name: rank_in_family
        data_type: bigint
        description: "Revenue rank within the model family ordered by ytd_net_revenue descending. Rank 1 = highest revenue model in the family."

      - name: rank_in_region
        data_type: bigint
        description: "Revenue rank within the source region ordered by ytd_net_revenue descending. Rank 1 = highest revenue model in the region."

      - name: rank_overall
        data_type: bigint
        description: "Overall revenue rank across all model + region combinations ordered by ytd_net_revenue descending."

      - name: revenue_per_customer
        data_type: numeric
        description: "Net revenue per unique customer year-to-date. NULL if unique_customers_ytd is zero."

      - name: cumulative_revenue_pct
        data_type: numeric
        description: "Cumulative share of total net revenue when models are sorted by ytd_net_revenue descending. Used for Pareto / 80-20 analysis."


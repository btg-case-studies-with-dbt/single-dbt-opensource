


models:
  - name: metric_definitions
    description: "Governed metric-definition catalog for revenue metrics used by the WBR agent and business reporting. One row per published metric definition promoted from the dbt seed into prod_mart_gold."
    group: finance
    columns:
      - name: metric_key
        data_type: character varying
        description: "Stable technical key for the metric definition."
        tests:
          - unique
          - not_null

      - name: display_name
        data_type: character varying
        description: "Human-readable metric label."

      - name: business_term
        data_type: character varying
        description: "Business-facing term or alias that should map to the governed metric."

      - name: grain
        data_type: character varying
        description: "Primary aggregation grain for the metric definition, such as weekly or monthly."

      - name: unit
        data_type: character varying
        description: "Published unit of measure."

      - name: source_table
        data_type: character varying
        description: "Fully-qualified mart table that publishes the metric."

      - name: source_column
        data_type: character varying
        description: "Column name on the source mart that carries the published metric."

      - name: formula_definition
        data_type: character varying
        description: "Business formula or transformation rule for the metric."

      - name: owner_team
        data_type: character varying
        description: "Owning business function for the metric definition."

      - name: notes
        data_type: character varying
        description: "Additional usage notes for the metric definition."

  - name: model_revenue_monthly
    description: "Monthly revenue aggregated at model variant + source region level. One row per model_variant + source_region + month. Incremental with delete+insert — lookback window is 2 months. Includes MoM absolute and percentage changes in gross revenue, net revenue, and unique customer count."
    group: finance
    columns:
      - name: model_variant
        data_type: character varying
        description: "Model variant identifier e.g. claude-3-5-sonnet-20241022. Part of the composite unique key."

      - name: model_family
        data_type: character varying
        description: "Model family grouping e.g. Claude 3, Claude 3.5. Joined from dim_model."

      - name: model_publisher
        data_type: character varying
        description: "Organisation that published the model — Anthropic, Meta, Mistral etc. Joined from dim_model."

      - name: source_region
        data_type: character varying
        description: "AWS region where the request originated e.g. us-east-1. Part of the composite unique key."

      - name: territory
        data_type: character varying
        description: "AWS territory grouping — Americas, EMEA, APAC. Joined from dim_region."

      - name: govcloud
        data_type: boolean
        description: "{{ doc('govcloud_definition') }}"

      - name: month_start_date
        data_type: date
        description: "First day of the calendar month. Part of the composite unique key."

      - name: month_end_date
        data_type: date
        description: "Last day of the calendar month."

      - name: total_gross_revenue
        data_type: numeric
        description: "Total gross revenue across all customers using this model in this region for the month, before discounts and credits."

      - name: total_net_revenue
        data_type: numeric
        description: "{{ doc('net_revenue_definition') }}"

      - name: unique_customers
        data_type: bigint
        description: "Number of distinct customer accounts that generated revenue from this model + region in the month."

      - name: active_days
        data_type: bigint
        description: "Number of distinct days with revenue activity in the month."

      - name: avg_daily_net_revenue
        data_type: numeric
        description: "Average net revenue per active day in the month."

      - name: max_daily_net_revenue
        data_type: numeric
        description: "Highest single-day net revenue in the month."

      - name: prior_month_gross_revenue
        data_type: numeric
        description: "Gross revenue from the previous calendar month. NULL for the first month on record for this model + region."

      - name: prior_month_net_revenue
        data_type: numeric
        description: "Net revenue from the previous calendar month. NULL for the first month on record."

      - name: prior_month_unique_customers
        data_type: bigint
        description: "Unique customer count from the previous calendar month. NULL for the first month on record."

      - name: mom_gross_revenue_change
        data_type: numeric
        description: "{{ doc('mom_change_definition') }} Applied to gross revenue."

      - name: mom_net_revenue_change
        data_type: numeric
        description: "Month-over-month absolute change in net revenue. NULL for the first month on record."

      - name: mom_customer_change
        data_type: bigint
        description: "Month-over-month absolute change in unique customer count. NULL for the first month on record."

      - name: mom_gross_revenue_pct_change
        data_type: numeric
        description: "Month-over-month percentage change in gross revenue. NULL when prior month is zero or missing."

      - name: mom_net_revenue_pct_change
        data_type: numeric
        description: "Month-over-month percentage change in net revenue. NULL when prior month is zero or missing."


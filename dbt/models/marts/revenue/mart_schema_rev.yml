      - name: max_daily_net_revenue
        data_type: numeric
        description: "Highest single-day net revenue in the week."

      - name: prior_week_gross_revenue
        data_type: numeric
        description: "Gross revenue from the previous week. NULL for the first week on record for this model + region."

      - name: prior_week_net_revenue
        data_type: numeric
        description: "Net revenue from the previous week. NULL for the first week on record."

      - name: prior_week_unique_customers
        data_type: bigint

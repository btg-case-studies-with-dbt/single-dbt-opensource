semantic_models:

  - name: token_usage_customer_monthly
    description: "Monthly token usage at customer + model + region level."
    model: ref('token_usage_customer_monthly')
    defaults:
      agg_time_dimension: tu_month_start_date
    entities:
      - name: account_id
        type: primary
      - name: model_variant
        type: foreign
    dimensions:
      - name: tu_month_start_date
        expr: month_start_date
        type: time
        type_params:
          time_granularity: month
      - name: model_type
        type: categorical
    measures:
      - name: total_tokens
        agg: sum
        create_metric: false
      - name: total_requests
        agg: sum
        create_metric: false
      - name: total_input_tokens
        agg: sum
        create_metric: false
      - name: total_output_tokens
        agg: sum
        create_metric: false
      - name: error_rate_pct
        agg: average
        create_metric: false
      - name: active_minutes
        agg: sum
        create_metric: false
      - name: mean_rpm_active
        agg: average
        create_metric: false
      - name: peak_rpm
        agg: max
        create_metric: false
      - name: mean_tpm_active
        agg: average
        create_metric: false
      - name: peak_tpm
        agg: max
        create_metric: false
      - name: cust_monthly_total_possible_minutes
        expr: total_possible_minutes
        agg: max
        create_metric: false
      - name: cust_monthly_active_minute_pct
        expr: active_minute_pct
        agg: average
        create_metric: false
      - name: cust_monthly_mean_rpm_all_minutes
        expr: mean_rpm_all_minutes
        agg: average
        create_metric: false
      - name: cust_monthly_mean_tpm_all_minutes
        expr: mean_tpm_all_minutes
        agg: average
        create_metric: false
      - name: cust_monthly_p90_rpm
        expr: p90_rpm
        agg: average
        create_metric: false
      - name: cust_monthly_p95_rpm
        expr: p95_rpm
        agg: average
        create_metric: false
      - name: cust_monthly_p97_rpm
        expr: p97_rpm
        agg: average
        create_metric: false
      - name: cust_monthly_p90_tpm
        expr: p90_tpm
        agg: average
        create_metric: false
      - name: cust_monthly_p95_tpm
        expr: p95_tpm
        agg: average
        create_metric: false
      - name: cust_monthly_p97_tpm
        expr: p97_tpm
        agg: average
        create_metric: false
      - name: cust_monthly_mom_mean_rpm_active
        expr: mom_mean_rpm_active
        agg: average
        create_metric: false
      - name: cust_monthly_mom_mean_tpm_active
        expr: mom_mean_tpm_active
        agg: average
        create_metric: false
      - name: cust_monthly_mom_total_tokens
        expr: mom_total_tokens
        agg: sum
        create_metric: false
      - name: cust_monthly_mom_total_requests
        expr: mom_total_requests
        agg: sum
        create_metric: false
      - name: cust_monthly_mom_active_minutes
        expr: mom_active_minutes
        agg: sum
        create_metric: false


        agg: sum
        create_metric: false
      - name: cust_weekly_wow_gross_revenue_change
        expr: wow_gross_revenue_change
        agg: sum
        create_metric: false
      - name: cust_weekly_wow_net_revenue_change
        expr: wow_net_revenue_change
        agg: sum
        create_metric: false

  - name: customer_revenue_monthly

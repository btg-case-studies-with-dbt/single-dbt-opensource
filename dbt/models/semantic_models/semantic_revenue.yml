semantic_models:

  - name: revenue_daily
    description: "Daily revenue fact. Base additive revenue measures re-pointed onto fct_revenue_daily for region and day-level decomposition."
    model: ref('fct_revenue_daily')
    defaults:
      agg_time_dimension: revenue_date
    entities:
      - name: revenue_id
        type: primary
      - name: account_id
        type: foreign
      - name: model_variant
        type: foreign
    dimensions:
      - name: revenue_date
        type: time
        type_params:
          time_granularity: day
      - name: source_region
        type: categorical
      - name: billing_type
        type: categorical
    measures:
      - name: total_net_revenue
        expr: net_revenue
        agg: sum
        create_metric: false
      - name: total_gross_revenue
        agg: sum
        create_metric: false

  - name: customer_revenue_weekly
    description: "Weekly revenue aggregated at customer level."
    model: ref('customer_revenue_weekly')
    defaults:
      agg_time_dimension: week_start_date
    entities:
      - name: account_id
        type: primary
    dimensions:
      - name: week_start_date
        type: time
        type_params:
          time_granularity: week
      - name: segment
        type: categorical
      - name: vertical
        type: categorical
      - name: company_name
        type: categorical
    measures:
      - name: active_days
        agg: sum
        create_metric: false
      - name: wow_net_revenue_pct_change
        agg: sum
        create_metric: false
      - name: wow_gross_revenue_pct_change
        agg: sum
        create_metric: false
      - name: weekly_avg_daily_net_revenue
        expr: avg_daily_net_revenue
        agg: sum
        create_metric: false
      - name: cust_weekly_max_daily_net_revenue
        expr: max_daily_net_revenue
        agg: max
        create_metric: false
      - name: cust_weekly_min_daily_net_revenue
        expr: min_daily_net_revenue
        agg: min
        create_metric: false
      - name: cust_weekly_prior_week_gross_revenue

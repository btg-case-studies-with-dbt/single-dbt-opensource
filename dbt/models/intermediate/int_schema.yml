version: 2
groups:
  - name: finance
    owner:
      name: Finance Team
      email: finance@company.com
      
models:

  # ============================================================================
  # int_quota_first_activity
  # ============================================================================
  - name: int_quota_first_activity
    description: "Earliest week a customer interacted with a model + region, anchored from BOTH int_token_usage_minute AND stg_quota_customer_rate_limit_requests. A customer who submitted a quota request before any usage still gets a spine starting that week."
    columns:
      - name: account_id
        description: "Customer account identifier"
        tests:
          - not_null
      - name: model_variant
        description: "Model variant identifier"
        tests:
          - not_null
      - name: inference_scope
        description: "global, regional, or multi-region"
        tests:
          - not_null
      - name: source_region
        description: "AWS source region"
        tests:
          - not_null
      - name: first_week_start_date
        description: "Sunday of the earliest week this account had usage or a quota request for this model + scope + region"
        tests:
          - not_null

  # ============================================================================
  # int_quota_weekly_spine
  # ============================================================================
  - name: int_quota_weekly_spine
    description: "Complete weekly time series per (account_id, model_variant, inference_scope, source_region) from first_week_start_date through the current week. One row per combo per week. Used as the backbone for quota tracking — ensures customers have rows even for weeks with no activity."
    columns:
      - name: account_id
        tests:
          - not_null
      - name: model_variant
        tests:
          - not_null
      - name: inference_scope
        tests:
          - not_null
      - name: source_region
        tests:
          - not_null
      - name: week_start_date
        description: "Sunday that starts the week"
        tests:
          - not_null
      - name: week_end_date
        description: "Saturday that ends the week"
        tests:
          - not_null

  # ============================================================================
  # int_quota_history_resolved
  # ============================================================================
  - name: int_quota_history_resolved
    description: "Resolves the effective rate limit AND pending request state for every week in the spine. Approved limits are carried forward week-over-week using island-counting window functions — a limit set in January is visible through February until a March limit supersedes it. Pending requests are flagged for every week they were open, not just the week they were submitted."
    columns:
      - name: account_id
        tests:
          - not_null
      - name: model_variant
        tests:
          - not_null
      - name: inference_scope
        tests:
          - not_null
      - name: source_region
        tests:
          - not_null
      - name: week_start_date
        tests:
          - not_null
      - name: week_end_date
        tests:
          - not_null
      - name: effective_rpm
        description: "RPM limit in effect: approved (carried forward) if exists, default otherwise"
      - name: effective_tpm
        description: "TPM limit in effect: approved (carried forward) if exists, default otherwise"
      - name: effective_tpd
        description: "TPD limit in effect: approved (carried forward) if exists, default otherwise"
      - name: is_using_default
        description: "True when no approved adjustment has been made yet for this week"
        tests:
          - not_null
      - name: adjusted_rpm
        description: "Approved RPM carried forward. NULL when on default."
      - name: adjusted_tpm
        description: "Approved TPM carried forward. NULL when on default."
      - name: adjusted_tpd
        description: "Approved TPD carried forward. NULL when on default."
      - name: default_rpm
        description: "System default RPM for this model + scope + region"
      - name: default_tpm
        description: "System default TPM for this model + scope + region"
      - name: default_tpd
        description: "System default TPD for this model + scope + region"
      - name: has_pending_request
        description: "True when at least one quota request was in pending state during this specific week"
        tests:
          - not_null
      - name: pending_requested_rpm
        description: "Highest RPM value requested across all pending requests active this week"
      - name: pending_requested_tpm
        description: "Highest TPM value requested across all pending requests active this week"
      - name: pending_requested_tpd
        description: "Highest TPD value requested across all pending requests active this week"

  # ============================================================================
  # int_token_usage_minute
  # ============================================================================
  - name: int_token_usage_minute
    description: "Minute-level token usage combining proprietary and open source inference. Union of stg_token_usage_proprietary and stg_token_usage_open_source enriched with customer, model, and region dimensions. One row per account, model, region, and minute."
    columns:

      # -- Customer foreign key --
      - name: account_id
        description: "Customer account identifier"
        tests:
          - not_null

      # -- Model dimensions --
      - name: model_variant
        description: "Model variant identifier"
        tests:
          - not_null

      - name: model_type
        description: "proprietary or open_source"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['proprietary', 'open_source']

      # -- Region dimensions --
      - name: source_region
        description: "AWS source region"
        tests:
          - not_null

      - name: inference_region
        description: "AWS inference region"
        tests:
          - not_null

      - name: inference_scope
        description: "global, regional, or multi-region"
        tests:
          - not_null

      - name: traffic_type
        description: "Type of traffic: standard, batch, etc."

      # -- Time grain --
      - name: minute_timestamp
        description: "Truncated to minute — the grain of this table"
        tests:
          - not_null

      - name: event_date
        description: "Date of the event"
        tests:
          - not_null

      # -- Metrics --
      - name: request_count
        description: "Number of requests in this minute (RPM)"
        tests:
          - not_null

      - name: input_tokens
        description: "Total input tokens in this minute"
        tests:
          - not_null

      - name: output_tokens
        description: "Total output tokens in this minute"
        tests:
          - not_null

      - name: cache_read_tokens
        description: "Total cache read tokens in this minute"
        tests:
          - not_null

      - name: cache_write_tokens
        description: "Total cache write tokens in this minute"
        tests:
          - not_null

      - name: total_tokens
        description: "Total tokens in this minute (TPM)"
        tests:
          - not_null

      - name: error_count
        description: "Number of errored requests in this minute"
        tests:
          - not_null

      - name: error_rate_pct
        description: "Percentage of requests that resulted in an error"

      - name: loaded_at
        description: "Latest loaded_at from source records"
        tests:
          - not_null

  # ============================================================================
  # int_revenue_daily
  # ============================================================================
  - name: int_revenue_daily
    description: "Daily revenue at the account × model × region × day grain, carrying foreign keys and revenue measures only. Net revenue derived as gross revenue minus savings plan and discounts. Dimension attributes (company, segment, model family, territory, etc.) are intentionally NOT denormalized here — downstream marts resolve them by joining the conformed dims (dim_customer / dim_model / dim_region)."
    config:
      group: finance
      access: private


    columns:

      # -- Customer foreign key --
      - name: account_id
        description: "Customer account identifier"
        tests:
          - not_null

      # -- Model dimensions --
      - name: model_variant
        description: "Model variant identifier"
        tests:
          - not_null

      - name: product_sku
        description: "Product SKU"
        tests:
          - not_null

      - name: inference_scope
        description: "global, regional, or multi-region"
        tests:
          - not_null

      - name: billing_type
        description: "Billing type: pay-as-you-go, savings-plan, committed-use"
        tests:
          - not_null

      # -- Region foreign key --
      - name: source_region
        description: "AWS source region"
        tests:
          - not_null

      # -- Revenue metrics --
      - name: gross_rev_input_tokens
        description: "Gross revenue from input tokens"
        tests:
          - not_null

      - name: gross_rev_output_tokens
        description: "Gross revenue from output tokens"
        tests:
          - not_null

      - name: gross_rev_cache_read_tokens
        description: "Gross revenue from cache read tokens"
        tests:
          - not_null

      - name: gross_rev_cache_write_tokens
        description: "Gross revenue from cache write tokens"
        tests:
          - not_null

      - name: total_gross_revenue
        description: "Total gross revenue — sum of all token revenue components"
        tests:
          - not_null

      - name: savings_plan_amount
        description: "Savings plan discount applied"

      - name: discount_amount
        description: "Additional discount applied"

      - name: net_revenue
        description: "Net revenue after savings plan and discounts"
        tests:
          - not_null

      - name: revenue_date
        description: "Date of the revenue — grain of this table"
        tests:
          - not_null

      - name: snapshot_date
        description: "Snapshot date of the source revenue extract"

      - name: currency_code
        description: "Currency code e.g. USD"
        tests:
          - not_null

      - name: loaded_at
        description: "Timestamp when record was loaded into bronze"
        tests:
          - not_null

version: 2

seeds:
  - name: region_mapping
    description: "AWS region reference data — maps AWS region codes to territories, airport codes, and GovCloud flags. 29 rows, one per AWS region. Static reference table — changes only when AWS adds new regions."
    tags: ['reference', 'static', 'seeds']
    
    config:
      schema: seeds
      column_types:
        source_region: varchar
        airport_code:  varchar
        territory:     varchar
        govcloud:      boolean   # critical — must be boolean, not varchar
        description:   varchar

    columns:
      - name: source_region
        description: "AWS region code e.g. us-east-1. Primary key — one row per region."
        tests:
          - unique
          - not_null

      - name: airport_code
        description: "Three-letter IATA airport code for the region's physical location e.g. IAD for us-east-1."
        tests:
          - not_null

      - name: territory
        description: "Geographic territory grouping. Used to aggregate metrics by region in mart models."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['US', 'North America', 'Europe', 'Asia Pacific', 'Middle East', 'Africa', 'South America', 'China', 'US GovCloud']
              

      - name: govcloud
        description: "True if this is an AWS GovCloud region requiring special compliance handling. Must be boolean — dbt infers varchar from CSV without explicit column_types declaration."
        tests:
          - not_null

      - name: description
        description: "Human-readable region description e.g. 'US East (N. Virginia) - Primary US region'."
        tests:
          - not_null

  - name: metric_definitions_seed
    description: "Seed-backed metric catalog for governed business metrics used by the WBR agent. One row per published metric definition that is promoted into prod_mart_gold.metric_definitions."
    tags: ['reference', 'semantic-layer', 'seeds']

    config:
      schema: seeds
      column_types:
        metric_key: varchar
        display_name: varchar
        business_term: varchar
        grain: varchar
        unit: varchar
        source_table: varchar
        source_column: varchar
        formula_definition: varchar
        owner_team: varchar
        notes: varchar

    columns:
      - name: metric_key
        description: "Stable technical key for the metric definition."
        tests:
          - unique
          - not_null

      - name: display_name
        description: "Human-readable metric label."
        tests:
          - not_null

      - name: business_term
        description: "Business-facing term or alias the agent should map to the governed metric."
        tests:
          - not_null

      - name: grain
        description: "Primary aggregation grain for the metric definition, such as weekly or monthly."
        tests:
          - not_null

      - name: unit
        description: "Published unit of measure, such as usd_millions, usd, or percent."
        tests:
          - not_null

      - name: source_table
        description: "Fully-qualified mart table that publishes the metric."
        tests:
          - not_null

      - name: source_column
        description: "Column name on the source mart that carries the published metric."
        tests:
          - not_null

      - name: formula_definition
        description: "Business formula or transformation rule for the metric."
        tests:
          - not_null

      - name: owner_team
        description: "Owning business function for the metric definition."
        tests:
          - not_null

  - name: seed_evidence_tickets
    description: "Synthetic support ticket and feedback seed data for the evidence RAG layer backing the conversational-BI agent. 50 rows covering 3 accounts across 3 regions with 8 topic categories. Used by stg_evidence_tickets to populate the staging view consumed by evidence_retriever.py."
    tags: ['reference', 'seeds', 'conversational-bi']

    config:
      schema: seeds
      column_types:
        ticket_id:    varchar
        account_id:   varchar
        customer_id:  varchar
        region:       varchar
        model_family: varchar
        date:         date
        severity:     varchar
        sentiment:    varchar
        topic:        varchar
        summary:      varchar

    columns:
      - name: ticket_id
        description: "Unique ticket identifier e.g. TKT-001. Primary key."
        tests:
          - unique
          - not_null

      - name: account_id
        description: "Account identifier matching the account dimension. Values: ACME-1234, GLOBEX-5678, INITE-9012."
        tests:
          - not_null
          - accepted_values:
              values: ['ACME-1234', 'GLOBEX-5678', 'INITE-9012']

      - name: customer_id
        description: "Internal customer identifier associated with the account."
        tests:
          - not_null

      - name: region
        description: "AWS region code where the issue was reported."
        tests:
          - not_null
          - accepted_values:
              values: ['us-east-1', 'eu-west-1', 'ap-southeast-2']

      - name: model_family
        description: "Model family involved in the ticket, e.g. claude-sonnet-4, gpt-4o, claude-haiku-3."
        tests:
          - not_null

      - name: date
        description: "Date the ticket was created."
        tests:
          - not_null

      - name: severity
        description: "Severity level: HIGH, MEDIUM, or LOW."
        tests:
          - not_null
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']

      - name: sentiment
        description: "Customer sentiment: positive, neutral, or negative."
        tests:
          - not_null
          - accepted_values:
              values: ['positive', 'neutral', 'negative']

      - name: topic
        description: "Issue topic category — one of: login_failure, data_latency, billing_anomaly, quota_throttling, model_performance, api_error, feature_request, documentation."
        tests:
          - not_null
          - accepted_values:
              values:
                ['login_failure', 'data_latency', 'billing_anomaly', 'quota_throttling',
                 'model_performance', 'api_error', 'feature_request', 'documentation']

      - name: summary
        description: "Short sentence describing the issue, under 200 characters."
        tests:
          - not_null
